"$schema" = "https://starship.rs/config-schema.json"

palette = "catppuccin_mocha"
add_newline = false
command_timeout = 500

# Left: separator rule, info line, prompt line. Right: duration + time.
format = """
${custom.separator}
$username$hostname$directory$git_branch$git_commit$git_state$git_status$status$jobs
$character"""
right_format = "$cmd_duration$time"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
overlay0 = "#6c7086"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold mauve)"

[directory]
style = "bold blue"
truncate_to_repo = true
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "red"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "bold mauve"
truncation_length = 24
truncation_symbol = "…"
format = "on [$symbol$branch(:$remote_branch)]($style) "

[git_commit]
tag_disabled = false
tag_symbol = "  "
style = "bold green"
format = "[\\($hash$tag\\)]($style) "

[git_state]
style = "bold yellow"
format = "[\\($state( $progress_current/$progress_total)\\)]($style) "

[git_status]
style = "bold peach"
format = "([\\[$all_status$ahead_behind\\]]($style) )"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = "$"
modified = "[!$count](peach)"
staged = "[+$count](green)"
renamed = "»"
deleted = "✘"

[jobs]
symbol = "✦"
style = "bold sapphire"
number_threshold = 1
format = "[$symbol$number]($style) "

[cmd_duration]
min_time = 2000
style = "yellow"
format = "[took $duration]($style) "

[time]
disabled = false
time_format = "%H:%M"
style = "overlay0"
format = "[$time]($style)"

[status]
disabled = false
symbol = "✘ "
style = "bold red"
format = "[$symbol$status]($style) "

[username]
style_user = "bold yellow"
style_root = "bold red"
format = "[$user]($style)@"

[hostname]
ssh_only = true
style = "bold teal"
format = "[$hostname]($style) "

# Dim full-width rule between commands.
[custom.separator]
command = "w=$(stty size </dev/tty 2>/dev/null | cut -d' ' -f2); printf '─%.0s' $(seq 1 ${w:-80})"
when = true
shell = ["sh"]
style = "overlay0"
format = "[$output]($style)"
